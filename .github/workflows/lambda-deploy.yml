name: Deploy Wistia Lambdas

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws:
    name: Verify AWS Deployment Access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          request_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience="
              + urllib.parse.quote("sts.amazonaws.com")
          )
          request = urllib.request.Request(
              request_url,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for field in ("iss", "aud", "sub"):
              print(f"{field}: {claims.get(field)}")
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::214118274300:role/WistiaGitHubDeployRole
          aws-region: us-east-1
          role-session-name: WistiaGitHubDeployVerify

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ingestion Lambda access
        run: |
          aws lambda get-function-configuration \
            --function-name wistia-events-ingestion-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json

      - name: Verify scheduler Lambda access
        run: |
          aws lambda get-function-configuration \
            --function-name wistia-pipeline-scheduler-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json
