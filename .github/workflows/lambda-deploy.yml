name: Deploy Wistia Lambdas

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Lambda deployment target"
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - ingestion
          - scheduler
          - watchdog
      confirmation:
        description: "Enter DEPLOY to authorize a Lambda update"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: wistia-lambda-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify-aws:
    name: Verify AWS Deployment Access
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment confirmation
        if: ${{ inputs.target != 'verify-only' }}
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY" ]; then
            echo "Deployment requires confirmation: DEPLOY"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        if: ${{ inputs.target != 'verify-only' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda deployment packages
        if: ${{ inputs.target != 'verify-only' }}
        run: |
          python scripts/build_lambda_packages.py

      - name: Verify Lambda ZIP packages
        if: ${{ inputs.target != 'verify-only' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          packages = {
              "wistia-events-ingestion.zip": [
                  "ingest_wistia_events.py",
                  "requests/__init__.py",
              ],
              "wistia-pipeline-scheduler.zip": [
                  "start_wistia_pipeline.py",
                  "wistia_schedule_dates.py",
              ],
              "wistia-pipeline-watchdog.zip": [
                  "check_wistia_daily_execution.py",
                  "wistia_schedule_dates.py",
              ],
          }

          for name, required_files in packages.items():
              path = Path("build/lambda") / name
              if not path.is_file():
                  raise FileNotFoundError(path)

              with ZipFile(path) as archive:
                  names = set(archive.namelist())
                  missing = set(required_files) - names
                  if missing:
                      raise RuntimeError(f"{name}: missing {missing}")
                  if archive.testzip() is not None:
                      raise RuntimeError(f"{name}: invalid ZIP")

              print(f"Verified: {name} ({path.stat().st_size:,} bytes)")
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::214118274300:role/WistiaGitHubDeployRole
          aws-region: us-east-1
          role-session-name: WistiaGitHubDeployVerify

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ingestion Lambda access
        run: |
          aws lambda get-function-configuration \
            --function-name wistia-events-ingestion-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json

      - name: Verify scheduler Lambda access
        run: |
          aws lambda get-function-configuration \
            --function-name wistia-pipeline-scheduler-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json
      - name: Deploy ingestion Lambda
        if: ${{ inputs.target == 'ingestion' && inputs.confirmation == 'DEPLOY' }}
        run: |
          aws lambda update-function-code \
            --function-name wistia-events-ingestion-dev \
            --zip-file fileb://build/lambda/wistia-events-ingestion.zip

          aws lambda wait function-updated \
            --function-name wistia-events-ingestion-dev

          aws lambda get-function-configuration \
            --function-name wistia-events-ingestion-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
            --output json

      - name: Deploy scheduler Lambda
        if: ${{ inputs.target == 'scheduler' && inputs.confirmation == 'DEPLOY' }}
        run: |
          aws lambda update-function-code \
            --function-name wistia-pipeline-scheduler-dev \
            --zip-file fileb://build/lambda/wistia-pipeline-scheduler.zip

          aws lambda wait function-updated \
            --function-name wistia-pipeline-scheduler-dev

          aws lambda get-function-configuration \
            --function-name wistia-pipeline-scheduler-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
            --output json

      - name: Deploy watchdog Lambda
        if: ${{ inputs.target == 'watchdog' && inputs.confirmation == 'DEPLOY' }}
        run: |
          aws lambda update-function-code \
            --function-name wistia-pipeline-watchdog-dev \
            --zip-file fileb://build/lambda/wistia-pipeline-watchdog.zip

          aws lambda wait function-updated \
            --function-name wistia-pipeline-watchdog-dev

          aws lambda get-function-configuration \
            --function-name wistia-pipeline-watchdog-dev \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
            --output json
